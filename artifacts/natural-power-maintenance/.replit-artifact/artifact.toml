kind = "web"
previewPath = "/"
title = "Natural Power Group — Maintenance"
version = "1.0.0"
id = "artifacts/natural-power-maintenance"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21747

[services.development]
run = "pnpm --filter @workspace/natural-power-maintenance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/natural-power-maintenance", "run", "build" ]
serve = "static"
publicDir = "artifacts/natural-power-maintenance/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21747"
BASE_PATH = "/"
